<!doctype html>
<html lang="ja" data-font="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>発音トレーナー</title>
<meta name="description" content="英語の母音と子音を、お手本・録音・判定・聞き分けで練習する">
<meta name="theme-color" content="#F3F5F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--sunk:#E9EDF2;--ink:#1B222C;--ink2:#566070;--ink3:#8B95A3;--line:#DCE1E8;
  --short:#C9463C;--long:#2B66D6;--diph:#0F7D59;--r:#7547CC;
  --cons:#A4570C;--consfill:#F5E3CF;--ok:#0F7D59;--ng:#C23A33;--on-ink:#FFFFFF;
  --seg-on:#FFFFFF;
  --f-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",Roboto,sans-serif;
  --f-ph:"Gentium Book Plus","Gentium Plus","Charis SIL","Noto Serif",Georgia,serif;
  --shadow:0 -8px 28px rgba(16,28,44,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151B;--surface:#1A2028;--sunk:#232B35;--ink:#E7EBF0;--ink2:#A3ADBA;--ink3:#727D8B;--line:#2B3440;
    --short:#F2867A;--long:#79A5F5;--diph:#45C495;--r:#AE92F0;--cons:#E9A15A;--consfill:#5A3D22;--ok:#45C495;--ng:#F2867A;--on-ink:#11151B;
    --shadow:0 -8px 28px rgba(0,0,0,.5);--seg-on:#3A4654;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B;--surface:#1A2028;--sunk:#232B35;--ink:#E7EBF0;--ink2:#A3ADBA;--ink3:#727D8B;--line:#2B3440;
  --short:#F2867A;--long:#79A5F5;--diph:#45C495;--r:#AE92F0;--cons:#E9A15A;--consfill:#5A3D22;--ok:#45C495;--ng:#F2867A;--on-ink:#11151B;
  --shadow:0 -8px 28px rgba(0,0,0,.5);--seg-on:#3A4654;color-scheme:dark;
}
html{font-size:16px}
html[data-font="s"]{font-size:14.5px}
html[data-font="l"]{font-size:17.5px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.ph{font-family:var(--f-ph)}
.sl{color:var(--ink3);font-weight:400;opacity:.7;padding:0 .04em}
.ic{width:1.25rem;height:1.25rem;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;align-items:center;gap:.5rem;height:3.5rem;padding:0 1rem;max-width:40rem;margin:0 auto}
.top h1{font-size:1.125rem;font-weight:700;margin:0;flex:1;letter-spacing:.02em}
.top .meta{font-size:.8125rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.top .back{width:2.5rem;height:2.5rem;margin-left:-.6rem;display:grid;place-items:center;border-radius:50%}
.top .cat{font-size:.875rem;font-weight:700;color:var(--c)}
.pnav{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.25rem;min-width:0}
.pn{display:flex;align-items:center;gap:.2rem;min-width:0;height:2.5rem;padding:0 .35rem;border-radius:.7rem;color:var(--ink2)}
.pn.prev{justify-self:start}.pn.next{justify-self:end}
.pn:active{background:var(--sunk)}
.pn .ic{width:1rem;height:1rem;color:var(--ink3)}
.pn .pni{font-family:var(--f-ph);font-size:1.15rem;font-weight:700;color:var(--c)}
.pn .pnk{font-family:var(--f-ph);font-size:.8125rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcur{text-align:center;line-height:1.25}
.pcur .cat{display:block}
.pcur .meta{display:block;font-size:.6875rem}
.strip{display:flex;gap:.35rem;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -1rem .25rem;padding:.25rem 1rem .5rem;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sc{position:relative;flex:none;min-width:2.6rem;height:2.4rem;padding:0 .45rem;border-radius:.65rem;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;scroll-snap-align:center}
.sc .sci{font-family:var(--f-ph);font-size:1.05rem;font-weight:700;color:var(--c);line-height:1}
.sc .scb{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p) * 100%);background:var(--c)}
.sc.on{background:var(--c);border-color:var(--c)}
.sc.on .sci{color:var(--surface)}.sc.on .scb{background:var(--surface);opacity:.6}
.sgap{flex:none;width:1px;background:var(--line);margin:.35rem .2rem}
.nextp{display:flex;align-items:center;gap:.75rem;width:100%;margin:1.5rem 0 .5rem;padding:.9rem 1rem;border-radius:1rem;background:var(--surface);border:1px solid var(--line);text-align:left}
.nextp .nk{font-size:.75rem;color:var(--ink3);display:block}
.nextp .nw{display:flex;align-items:baseline;gap:.6rem}
.nextp .ni{font-family:var(--f-ph);font-size:1.6rem;font-weight:700;color:var(--c);line-height:1.2}
.nextp .ne{font-family:var(--f-ph);font-size:1rem;color:var(--ink2)}
.nextp .grow{flex:1}
.nextp .ic{color:var(--ink3)}
main{max-width:40rem;margin:0 auto;padding:.25rem 1rem 6rem}
body.sheet-open main{padding-bottom:22rem}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav>div{display:flex;width:100%;max-width:40rem}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0 .6rem;font-size:.6875rem;color:var(--ink3)}
.nav button .ic{width:1.4rem;height:1.4rem}
.nav button.on{color:var(--ink);font-weight:700}
body[data-view="phon"] .nav{display:none}

/* resume */
.resume{width:100%;display:flex;align-items:center;gap:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.8rem 1rem;text-align:left;margin:.25rem 0 1rem}
.resume-l{flex:1;min-width:0}
.resume-k{display:block;font-size:.75rem;color:var(--ink2)}
.resume-w{display:flex;align-items:baseline;gap:.6rem;font-size:1.125rem}
.resume-ipa{color:var(--c);font-size:1.5rem;line-height:1.2}
.resume-n{font-size:.8125rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.resume .ic{color:var(--ink3)}
.intro{font-size:.875rem;color:var(--ink2);margin:.25rem 0 1rem}

/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:.75rem;padding:.2rem;gap:.2rem}
.seg button{flex:1;padding:.45rem .4rem;border-radius:.6rem;font-size:.8125rem;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--seg-on);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(16,28,44,.12)}
.seg .n{font-size:.6875rem;color:var(--ink3);margin-left:.2rem;font-weight:400}

/* vowel chart */
.chart{margin:1.25rem 0 .5rem}
.chart-box{position:relative;margin:2.6rem 1.5rem 2.4rem 2.7rem;aspect-ratio:100/96}
.chart-bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tz{fill:var(--surface);stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.gl{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.ax{position:absolute;font-size:.6875rem;color:var(--ink3);white-space:nowrap;line-height:1}
.ax.f{left:0;top:-2.05rem}.ax.b{right:0;top:-2.05rem}
.ax.c{left:-2.5rem;top:.1rem}.ax.o{left:-2.5rem;bottom:0}
.node{position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);transform:translate(-50%,-50%);width:2.9rem;height:2.9rem;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,transparent)}
.node .ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1turn),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
.node-ipa{font-size:1.3rem;line-height:1;color:var(--c);font-weight:700}
.node-key{position:absolute;top:calc(100% + .3rem);left:50%;transform:translateX(-50%);font-size:.6875rem;color:var(--ink2);white-space:nowrap;line-height:1}
.node.full{background:var(--c)}
.node.full .node-ipa{color:var(--surface)}
.chart-note{font-size:.75rem;color:var(--ink2);margin:0;line-height:1.7}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--ink2);margin:.6rem 0 0}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:.6rem;height:.6rem;border-radius:50%;background:var(--c);display:inline-block}

/* tiles */
.sec-h{font-size:.9375rem;font-weight:700;margin:1.75rem 0 .7rem;display:flex;align-items:center;gap:.5rem}
.sec-h i{width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.7rem .7rem .9rem;text-align:left;overflow:hidden;display:flex;flex-direction:column;min-height:5.4rem}
.tile-ipa{font-size:1.5rem;line-height:1.15;color:var(--c);font-weight:700}
.tile-key{font-size:.9375rem;color:var(--ink)}
.tile-n{font-size:.6875rem;color:var(--ink3);margin-top:auto;font-variant-numeric:tabular-nums}
.tile-bar{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p) * 100%);background:var(--c)}
.kindseg{margin:.25rem 0 0}
.viewtog{display:flex;justify-content:flex-end;margin:.6rem 0 -.6rem}
.linkbtn{font-size:.8125rem;color:var(--ink2);padding:.35rem .1rem;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
/* consonant table */
.ctab{display:grid;grid-template-columns:3.9rem repeat(5,minmax(0,1fr));column-gap:.3rem;margin:1.25rem 0 .75rem}
.ctab .chd{font-size:.6875rem;color:var(--ink3);text-align:center;line-height:1.25;align-self:end;padding-bottom:.4rem}
.ctab .rl,.ctab .cell{border-top:1px solid var(--line);padding:.35rem 0}
.ctab .rl{font-size:.6875rem;color:var(--ink2);line-height:1.3;padding-top:1.3rem;padding-right:.2rem}
.ctab .cell{display:flex;flex-direction:column;gap:.3rem}
.cc{position:relative;height:3rem;border-radius:.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cons) 50%,transparent);line-height:1}
.cc.vd{background:var(--consfill)}
.cc-ipa{font-family:var(--f-ph);font-size:1.2rem;font-weight:700;color:var(--cons)}
.cc-key{font-family:var(--f-ph);font-size:.6875rem;color:var(--ink2);margin-top:.2rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .15rem}
.cc-bar{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p) * 100%);background:var(--cons)}
.cc.full{background:var(--cons)}.cc.full .cc-ipa{color:var(--surface)}.cc.full .cc-key{color:var(--surface)}
.cleg{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.75rem;color:var(--ink2);margin:.6rem 0 0}
.cleg span{display:inline-flex;align-items:center;gap:.4rem}
.cleg i{width:1.1rem;height:.8rem;border-radius:.25rem;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cons) 50%,transparent);background:var(--surface)}
.cleg i.vd{background:var(--consfill)}
/* mouth cross-section */
.hf{fill:none;stroke:var(--ink);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
.hl1{fill:none;stroke:var(--ink3);stroke-width:.6}
.ht{fill:var(--surface);stroke:var(--ink2);stroke-width:.5}
.hn{fill:var(--consfill);stroke:var(--cons);stroke-width:.8}
.hr{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round}
.hv{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.hg{fill:none;stroke:var(--ink2);stroke-width:1.2}.hg.on{stroke:var(--cons);stroke-width:1.7}
.hw{fill:none;stroke:var(--cons);stroke-width:.8;stroke-linejoin:round}
.ha{fill:none;stroke:var(--cons);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
.hp{fill:var(--cons);stroke:var(--surface);stroke-width:.6}
.hlead{fill:none;stroke:var(--ink3);stroke-width:.35;stroke-dasharray:1 1}
.cfig{position:relative;width:100%;aspect-ratio:100/110;margin:1.4rem 0 .4rem}
.cfig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cfig .cc{position:absolute;width:10.5%;height:9.55%;border-radius:.55rem}
.cfig .cc .cc-ipa{font-size:1.15rem}
.cfig .hn{stroke-width:.6;fill:color-mix(in srgb,var(--consfill) 60%,var(--bg))}
.cfig .clab{position:absolute;font-size:.6875rem;color:var(--ink2);line-height:1;white-space:nowrap;transform:translateY(-100%);padding-bottom:.25rem}
.mini.mouth{width:8.5rem}
.hero-act{grid-column:1/-1;display:flex;gap:.6rem;align-items:stretch;flex-wrap:wrap;margin-top:1rem}
.hero-act .keyplay{margin-top:0}
.hero-act .partner{min-width:0;flex-direction:row;align-items:center;gap:.6rem;padding:.35rem .9rem}
.hero-act .partner .pk{font-size:.6875rem}
.hero-act .partner .pi{font-size:1.2rem}
.hero-act .partner .pe{font-size:.875rem}
/* partner */
.partner{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.55rem .8rem .6rem;min-width:7.5rem;text-align:left}
.partner .pk{font-size:.6875rem;color:var(--ink3)}
.partner .pw{display:flex;align-items:baseline;gap:.45rem}
.partner .pi{font-family:var(--f-ph);font-size:1.5rem;font-weight:700;color:var(--c);line-height:1.15}
.partner .pe{font-family:var(--f-ph);font-size:.9375rem;color:var(--ink2)}
.micnote{margin:.7rem 0 0;font-size:.75rem;color:var(--ink2);text-align:center;line-height:1.6}
.pblock+.pblock{margin-top:1rem}
.pblock h4{margin:.6rem 0 0;font-size:.75rem;color:var(--ink3);font-weight:700}
.qscope{margin:0 0 1.25rem}
.soon{font-size:.8125rem;color:var(--ink3);margin:2rem 0 0;text-align:center}

/* phoneme hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;align-items:start;padding:1rem 0 1rem}
.hero-ipa{font-size:4rem;line-height:1;color:var(--c);font-weight:700;letter-spacing:-.01em}
.hero-sp{margin-top:.7rem;font-size:.75rem;color:var(--ink3)}
.hero-sp .sps{display:flex;flex-wrap:wrap;gap:0 .75rem;margin-top:.05rem}
.hero-sp b{font-family:var(--f-ph);font-size:1.15rem;color:var(--ink);font-weight:700}
.mini{width:8.5rem;height:auto;display:block;overflow:visible}
.mini .tz{fill:var(--surface)}
.mini .dot{fill:var(--line)}
.mini .tgt{fill:var(--c)}
.mini .gld{stroke:var(--c);stroke-width:2.4;fill:none;stroke-linecap:round}
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);margin:1rem 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:.6rem .5rem .6rem 0}
.facts div+div{padding-left:.75rem;border-left:1px solid var(--line)}
.facts dt{font-size:.6875rem;color:var(--ink3)}
.facts dd{margin:0;font-size:.875rem;font-weight:700;line-height:1.4}
.keyplay{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;background:var(--ink);color:var(--on-ink);border-radius:2rem;padding:.6rem 1.1rem .6rem .9rem;font-size:.9375rem}
.keyplay .ph{font-size:1.15rem}
.advice{display:grid;gap:.9rem;margin:.5rem 0 1.5rem}
.adv{padding-left:.9rem;border-left:3px solid var(--c)}
.adv.miss{border-left-color:var(--ink3)}
.adv h3{margin:0;font-size:.8125rem;color:var(--ink2);font-weight:700}
.adv p{margin:.1rem 0 0;font-size:.9375rem;line-height:1.75}

/* toolbar */
.toolbar{position:sticky;top:calc(3.5rem + env(safe-area-inset-top,0px));z-index:12;background:var(--bg);padding:.5rem 0 .6rem;margin:0 -1rem;padding-left:1rem;padding-right:1rem;border-bottom:1px solid transparent}
.toolbar.stuck{border-bottom-color:var(--line)}
.tb{display:flex;gap:.5rem;align-items:stretch}
.tb>button{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:.75rem;padding:.55rem .75rem;font-size:.875rem;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.tb .tb-main{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:700}
.tb .tb-speed{font-variant-numeric:tabular-nums;min-width:5.6rem}
.tb .tb-speed.on{border-color:var(--ink)}
.tb .tb-k{color:var(--ink2);font-size:.75rem}
.tb .tb-v{font-weight:700}
.tb .grow{flex:1}
.tb .tb-tog{padding:.55rem .6rem}
.tb .tb-tog.off{color:var(--ink3);background:var(--sunk);border-color:var(--sunk)}
.tb .tb-tog.off .lbl{text-decoration:line-through}
.tb>button{min-width:0}
@media (max-width:380px){.tb{gap:.4rem}.tb>button{padding:.55rem .6rem}.tb .tb-k{display:none}.tb .tb-speed{min-width:3.6rem}}
.speedpanel{margin-top:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.8rem 1rem .9rem}
.sp-row{display:flex;align-items:center;gap:.75rem}
.sp-row input{flex:1}
.sp-val{font-size:1.125rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.6rem;text-align:right}
.sp-pre{display:flex;gap:.4rem;margin-top:.6rem}
.sp-pre button{flex:1;padding:.4rem 0;border-radius:.6rem;background:var(--sunk);font-size:.8125rem;font-variant-numeric:tabular-nums}
.sp-pre button.on{background:var(--ink);color:var(--on-ink);font-weight:700}
input[type=range]{accent-color:var(--ink);height:1.75rem}

.levels{margin:.9rem 0 1rem}

/* word groups */
.grp{margin-bottom:1rem}
.ghead{width:100%;display:flex;align-items:center;gap:.6rem;padding:.6rem 0;text-align:left;border-bottom:1px solid var(--line)}
.ghead .gl{font-family:var(--f-ph);font-size:1.0625rem;font-weight:700;color:var(--c)}
.ghead .gl.ja{font-family:var(--f-ui);font-size:.9375rem}
.ghead .gn{font-size:.75rem;color:var(--ink3);flex:1}
.ghead .ic{color:var(--ink3);transition:transform .2s}
.grp.open .ghead .ic{transform:rotate(90deg)}
.wrow{display:flex;align-items:center;gap:.75rem;padding:.55rem .25rem .55rem .25rem;border-bottom:1px solid var(--line);cursor:pointer;border-radius:.4rem}
.wrow.sel{background:color-mix(in srgb,var(--c) 9%,transparent)}
.wrow.playing{background:color-mix(in srgb,var(--c) 16%,transparent)}
.wl{flex:1;min-width:0}
.wt{font-family:var(--f-ph);font-size:1.3rem;line-height:1.3;display:flex;align-items:center;gap:.35rem}
.hl{color:var(--c);font-weight:700}
.ck{color:var(--ok);width:1rem;height:1rem}
.wi{font-family:var(--f-ph);font-size:.9375rem;color:var(--ink2);line-height:1.35}
.wr{text-align:right;max-width:44%;line-height:1.35}
.wja{font-size:.8125rem}
.lv{font-size:.6875rem;color:var(--ink3)}
.mask{display:inline-block;width:3.2rem;height:.55rem;border-radius:.3rem;background:var(--sunk);vertical-align:middle}
.play{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;border:1px solid var(--line);background:var(--surface)}
.play .ic{width:1rem;height:1rem}
.empty{font-size:.875rem;color:var(--ink2);padding:1rem 0}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.sh{pointer-events:auto;width:100%;max-width:40rem;background:var(--surface);border-radius:1.4rem 1.4rem 0 0;box-shadow:var(--shadow);padding:.75rem 1rem calc(1rem + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-top{display:flex;align-items:center;gap:.25rem}
.icb{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.icb:not(:disabled):active{background:var(--sunk)}
.sh-word{flex:1;text-align:center;min-width:0}
.sh-w{font-family:var(--f-ph);font-size:2.1rem;line-height:1.15}
.sh-meta{font-size:.875rem;color:var(--ink2);display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;align-items:center;min-height:1.5rem}
.sh-meta .ph{font-size:1.05rem}
.reveal{font-size:.75rem;color:var(--ink2);border:1px dashed var(--ink3);border-radius:1rem;padding:.05rem .6rem}
.sh-pos{position:absolute;font-size:.6875rem;color:var(--ink3)}
.sh-head{position:relative}
.sh-x{position:absolute;right:-.4rem;top:-.4rem}
.sh-bar{display:flex;justify-content:space-between;align-items:center;margin:-.35rem -.5rem .1rem 0}
.sh-idx{font-size:.75rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.icb.sm{width:2.3rem;height:2.3rem}
.sh-top+.sh-row{margin-top:.9rem}
.sh-row{display:flex;gap:.5rem;margin-top:.5rem}
.sh-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.75rem .25rem;border-radius:.85rem;background:var(--sunk);font-size:.875rem;white-space:nowrap}
.sh-row .rec{color:var(--ng)}
.sh-row .rec.on{background:var(--ng);color:#fff}
.sh-row .primary{background:var(--ink);color:var(--on-ink);font-weight:700;flex:1.4}
.sh-row .donebtn.on{background:var(--ok);color:#fff;font-weight:700}
.result{margin:.6rem 0 0;font-size:.8125rem;min-height:1.3rem;text-align:center;color:var(--ink2)}
.result.ok{color:var(--ok);font-weight:700}
.result.ng{color:var(--ng)}

/* quiz */
.q-start{padding:.5rem 0}
.q-title{font-size:1.5rem;font-weight:700;margin:.25rem 0 .25rem}
.q-lead{color:var(--ink2);font-size:.9375rem;margin:0 0 1.25rem;line-height:1.75}
.q-sum{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:1.5rem}
.q-sum div{padding:.7rem 0}
.q-sum div+div{padding-left:.9rem;border-left:1px solid var(--line)}
.q-sum dt{font-size:.6875rem;color:var(--ink3)}
.q-sum dd{margin:0;font-size:1.125rem;font-weight:700;font-variant-numeric:tabular-nums}
.btn-main{display:flex;width:100%;align-items:center;justify-content:center;gap:.5rem;background:var(--ink);color:var(--on-ink);border-radius:1rem;padding:1rem;font-size:1.0625rem;font-weight:700}
.btn-sub{display:flex;width:100%;justify-content:center;padding:.85rem;font-size:.9375rem;color:var(--ink2)}
.q-head{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:.5rem}
.q-dots{display:flex;gap:.3rem;margin:.6rem 0 0}
.q-dots i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.q-dots i.ok{background:var(--ok)}.q-dots i.ng{background:var(--ng)}.q-dots i.cur{background:var(--ink3)}
.q-stage{display:flex;flex-direction:column;align-items:center;padding:2.2rem 0 1.4rem}
.q-play{width:6rem;height:6rem;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.q-play .ic{width:2.2rem;height:2.2rem;margin-left:.25rem}
.q-slow{margin-top:.75rem;font-size:.875rem;color:var(--ink2);padding:.3rem .8rem}
.q-ask{text-align:center;font-size:.875rem;color:var(--ink2);margin:0 0 .8rem}
.q-choices{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.choice{background:var(--surface);border:1.5px solid var(--line);border-radius:1rem;padding:1.1rem .5rem;text-align:center;min-height:6.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
.choice .cw{font-family:var(--f-ph);font-size:1.9rem;line-height:1.1}
.choice .ci{font-family:var(--f-ph);font-size:1rem;color:var(--ink2)}
.choice.right{border-color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.choice.wrong{border-color:var(--ng);box-shadow:inset 0 0 0 1.5px var(--ng)}
.choice .hear{margin-top:.35rem;display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--ink2);border:1px solid var(--line);border-radius:1rem;padding:.2rem .65rem}
.choice .hear .ic{width:.8rem;height:.8rem}
.q-fb{text-align:center;font-weight:700;margin:1.1rem 0 .9rem;font-size:1rem}
.q-fb.ok{color:var(--ok)}.q-fb.ng{color:var(--ng)}
.q-score{font-size:3.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin:1.5rem 0 .3rem}
.q-score small{font-size:1.25rem;color:var(--ink3);font-weight:400}

/* settings */
.set-h{font-size:.8125rem;color:var(--ink2);font-weight:700;margin:1.6rem 0 .5rem}
.set-h:first-child{margin-top:.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.srow{padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.inline{display:flex;align-items:center;gap:1rem}
.srow .lab{flex:1;font-size:.9375rem}
.srow .desc{display:block;font-size:.75rem;color:var(--ink3);line-height:1.5;margin-top:.1rem}
.srow .val{font-weight:700;font-variant-numeric:tabular-nums;font-size:.9375rem}
.srow .rhead{display:flex;justify-content:space-between;align-items:baseline}
.srow input[type=range]{width:100%;margin-top:.2rem}
.srow .seg{margin-top:.5rem}
.srow select{width:100%;margin-top:.5rem;padding:.6rem .7rem;border-radius:.6rem;border:1px solid var(--line);background:var(--bg)}
.sw{width:3rem;height:1.8rem;border-radius:1rem;background:var(--sunk);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(1.2rem)}
.btn-line{padding:.5rem .9rem;border:1px solid var(--line);border-radius:.6rem;font-size:.875rem;background:var(--surface)}
.btn-line.danger{color:var(--ng)}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.pgrps{margin-top:.7rem;display:grid;gap:.55rem}
.pgrp{display:grid;grid-template-columns:4.6rem 1fr;gap:.6rem;align-items:start}
.pgl{font-size:.9375rem;color:var(--ink2);padding-top:.3rem;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{font-family:var(--f-ph);font-size:.9375rem;padding:.28rem .75rem;border-radius:1rem;border:1px dashed var(--line);color:var(--ink3);background:transparent;text-decoration:line-through;text-decoration-color:var(--ink3)}
.pill.on{background:var(--sunk);border:1px solid var(--sunk);color:var(--ink);text-decoration:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:.1rem .75rem;margin-top:.6rem}
.pairs label{display:flex;align-items:center;gap:.45rem;font-size:.875rem;padding:.3rem 0}
.pairs input{accent-color:var(--ink);width:1.05rem;height:1.05rem}
.pairs .pl{font-family:var(--f-ph)}
.status{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;font-size:.875rem;margin:0}
.status dt{color:var(--ink2)}
.status dd{margin:0;font-weight:700}
.status dd.no{color:var(--ng)}

#toast{position:fixed;left:50%;bottom:5.5rem;transform:translate(-50%,8px);background:var(--ink);color:var(--on-ink);padding:.6rem 1rem;border-radius:.75rem;font-size:.875rem;z-index:50;max-width:calc(100% - 2rem);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  for(let i=0;i<last;i++){
    const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

let allVoices=[];
function loadVoices(){try{allVoices=speechSynthesis.getVoices()||[]}catch(e){allVoices=[]}if(view==="settings")render()}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function vlang(v){return (v.lang||"").replace("_","-").toLowerCase()}
function enVoices(){const a=S.set.accent;return allVoices.filter(v=>{const l=vlang(v);return a==="us"?l==="en-us":a==="gb"?l==="en-gb":l.startsWith("en")})}
function pickVoice(){
  let pool=enVoices();if(!pool.length)pool=allVoices.filter(v=>vlang(v).startsWith("en"));
  if(S.set.voice){const v=pool.find(v=>v.voiceURI===S.set.voice);if(v)return v}
  return pool.find(v=>/google/i.test(v.name))||pool[0]||null;
}
function jaVoice(){const j=allVoices.filter(v=>vlang(v).startsWith("ja"));return j.find(v=>/google/i.test(v.name))||j[0]||null}
function speak(text,slow,onend,opt){
  opt=opt||{};
  if(!("speechSynthesis" in window)){toast("このブラウザは読み上げに対応していません");if(onend)onend();return}
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  const v=opt.ja?jaVoice():pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang=opt.ja?"ja-JP":(S.set.accent==="gb"?"en-GB":"en-US");
  u.rate=opt.rate||(opt.ja?1.05:(slow?S.set.slow:S.set.rate));
  if(onend){let f=false;const d=()=>{if(f)return;f=true;onend()};u.onend=d;u.onerror=d;setTimeout(d,2500+text.length*420/u.rate)}
  setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},60);
}
let playAll=null;
function startPlayAll(list){
  stopPlayAll();const tok={stop:false};playAll=tok;renderToolbar();
  let i=0,rep=0;
  const step=()=>{
    if(tok.stop)return;
    if(i>=list.length){stopPlayAll();return}
    const w=list[i];markPlaying(w.text);
    speak(w.text,false,()=>{
      if(tok.stop)return;
      rep++;if(rep<S.set.repeat){setTimeout(step,350);return}
      rep=0;
      const next=()=>{if(tok.stop)return;i++;setTimeout(step,S.set.gap*1000)};
      if(S.set.readJa)setTimeout(()=>{if(!tok.stop)speak(w.ja,false,next,{ja:true})},250);else next();
    });
  };
  step();
}
function stopPlayAll(){
  const was=!!playAll;
  if(playAll){playAll.stop=true;playAll=null;try{speechSynthesis.cancel()}catch(e){}}
  markPlaying(null);if(was)renderToolbar();
}
function markPlaying(text){
  document.querySelectorAll(".wrow").forEach(r=>{
    const on=text!==null&&r.dataset.w===text;r.classList.toggle("playing",on);
    if(on){const top=r.getBoundingClientRect().top;if(top<140||top>innerHeight-120)r.scrollIntoView({block:"center",behavior:"smooth"})}
  });
}

/* ---------- mic availability ---------- */
let micBlocked=false;
const inFrame=(()=>{try{return window.top!==window}catch(e){return true}})();
function micOK(){
  if(micBlocked)return false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return false;
  try{const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature&&!pp.allowsFeature("microphone"))return false}catch(e){}
  return true;
}
function judgeOK(){return !!SR&&micOK()}
function blockMic(){micBlocked=true;res={cls:"",html:""};renderSheet();toast("この画面ではマイクを使えません")}
/* ---------- recording ---------- */
const rec={mr:null,url:null,word:null,timer:null,tick:null,end:0};
async function toggleRecord(){
  if(rec.mr&&rec.mr.state==="recording"){rec.mr.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("この環境では録音できません");return}
  stopPlayAll();try{speechSynthesis.cancel()}catch(e){}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){if(inFrame&&e&&(e.name==="NotAllowedError"||e.name==="SecurityError")){blockMic();return}toast("マイクを使えません。ブラウザのマイク許可を確認してください");return}
  const chunks=[],mr=new MediaRecorder(stream),word=curW.text;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());clearTimeout(rec.timer);clearInterval(rec.tick);
    if(rec.url)URL.revokeObjectURL(rec.url);
    rec.url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||"audio/webm"}));
    rec.word=word;rec.mr=null;renderSheet();
    if(S.set.autoCmp&&curW&&curW.text===word)compare();
  };
  mr.start();rec.mr=mr;rec.end=Date.now()+S.set.recSec*1000;
  rec.timer=setTimeout(()=>{if(mr.state==="recording")mr.stop()},S.set.recSec*1000);
  rec.tick=setInterval(()=>{const b=document.getElementById("recbtn");if(b)b.querySelector(".t").textContent=recLabel()},200);
  renderSheet();
}
function recLabel(){if(rec.mr&&rec.mr.state==="recording"){return "停止 "+Math.max(0,(rec.end-Date.now())/1000).toFixed(1)+"秒"}return "録音"}
function playSelf(cb){if(!rec.url){if(cb)cb();return}const a=new Audio(rec.url);if(cb){a.onended=cb;a.onerror=cb}a.play().catch(()=>{if(cb)cb()})}
function compare(){stopPlayAll();speak(curW.text,false,()=>setTimeout(()=>playSelf(),300))}

/* ---------- recognition ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srBusy=false,res={cls:"",html:""};
function norm(s){return String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()}
function matches(t,target){const tg=norm(target),ok=new Set([tg,...(HOMO[tg]||[])]);if(NUM[tg])ok.add(NUM[tg]);const n=norm(t);if(ok.has(n))return true;return n.split(" ").some(x=>ok.has(x))}
function judge(){
  if(!SR){toast("このブラウザは判定に対応していません");return}
  if(srBusy)return;
  if(rec.mr&&rec.mr.state==="recording")rec.mr.stop();
  stopPlayAll();try{speechSynthesis.cancel()}catch(e){}
  const target=curW.text,pid=curP,r=new SR();
  r.lang=S.set.srLang;r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  let got=false,err=false;
  srBusy=true;res={cls:"",html:"聞いています。単語を1回言ってください"};renderSheet();
  r.onresult=e=>{
    got=true;const alts=[],rs=e.results[0];for(let i=0;i<rs.length;i++)alts.push(rs[i].transcript);
    const heard=esc(alts[0]||"");
    if(alts.some(a=>matches(a,target))){
      const first=!isDone(pid,target);setDone(pid,target,true);
      res={cls:"ok",html:`聞き取れました（認識結果 ${heard}）${first?"。クリアに追加しました":""}`};refreshRow(target);
    }else res={cls:"ng",html:`${heard} と認識されました。お手本を聞いてもう一度どうぞ`};
  };
  r.onerror=e=>{err=true;if(inFrame&&(e.error==="not-allowed"||e.error==="service-not-allowed")){srBusy=false;blockMic();return}const m={"not-allowed":"マイクの使用が許可されていません","service-not-allowed":"この環境では判定を使えません","no-speech":"声が聞こえませんでした。もう一度どうぞ","network":"ネットに接続できません。判定はネット接続が必要です","audio-capture":"マイクが見つかりません","aborted":"判定を中断しました"};res={cls:"ng",html:m[e.error]||("判定できませんでした（"+esc(e.error)+"）")}};
  r.onend=()=>{srBusy=false;if(!got&&!err)res={cls:"ng",html:"聞き取れませんでした。もう一度どうぞ"};renderSheet()};
  try{r.start()}catch(e){srBusy=false;res={cls:"ng",html:"判定を開始できませんでした"};renderSheet()}
}

const openG={},randOrder={},revealed={ipa:null,ja:null};

function viewGroups(p){
  const f=w=>!lvF||w.lv===lvF;
  if(S.set.order==="random"){
    if(!randOrder[p.id])randOrder[p.id]=shuffle(parseWords(p).flatMap(g=>g.words));
    const ws=randOrder[p.id].filter(f);return ws.length?[{i:-1,label:"ランダム順",words:ws}]:[];
  }

/* phoneme */
function region(x,y){return {t:x<35?"前":x<70?"中央":"奥",o:y<33?"狭い":y<66?"中くらい":"広い"}}
function factsOf(p){
  if(CPOS[p.id]){const [r,c,v]=CPOS[p.id];return {cons:true,place:PLACES[r],voice:v?"あり":"なし",manner:MANNER_D[c]}}
  if(POS[p.id]){const r=region(...POS[p.id]);return {t:r.t,o:r.o}}
  const [a,b]=GLIDE[p.id],r1=region(...a),r2=region(...b);
  return {t:r1.t===r2.t?r1.t:`${r1.t}から${r2.t}`,o:r1.o===r2.o?r1.o:`${r1.o}から${r2.o}`};
}
function mx(x,y){return [6+x*1.08,6+y*.86]}
function miniChart(p){
  const tz=[[0,0],[100,0],[100,100],[30,100]].map(([x,y])=>mx(x,y).join(" ")).join("L");
  const dots=Object.values(POS).map(([x,y])=>{const [a,b]=mx(x,y);return `<circle class="dot" cx="${a}" cy="${b}" r="2.2"/>`}).join("");
  let t="";
  if(POS[p.id]){const [a,b]=mx(...POS[p.id]);t=`<circle cx="${a}" cy="${b}" r="8.5" fill="var(--surface)"/><circle class="tgt" cx="${a}" cy="${b}" r="6"/>`}
  else{
    const [s,e]=GLIDE[p.id],[x1,y1]=mx(...s),[x2,y2]=mx(...e);
    const ang=Math.atan2(y2-y1,x2-x1),L=7,x3=x2-Math.cos(ang)*2,y3=y2-Math.sin(ang)*2;
    const ah=`M${x2-L*Math.cos(ang-0.5)} ${y2-L*Math.sin(ang-0.5)}L${x2} ${y2}L${x2-L*Math.cos(ang+0.5)} ${y2-L*Math.sin(ang+0.5)}`;
    t=`<circle class="tgt" cx="${x1}" cy="${y1}" r="4.5"/><path class="gld" d="M${x1} ${y1}L${x3} ${y3}"/><path class="gld" d="${ah}" stroke-linejoin="round"/>`;
  }
  return `<svg class="mini" viewBox="0 0 120 100" role="img" aria-label="母音図での位置"><path class="tz" d="M${tz}Z" stroke-width="1.2"/>${dots}${t}</svg>`;
}

const VPN=PAIRS.length-CPAIRS.length;
function idxRange(k){return PAIRS.map((_,i)=>i).filter(i=>k==="v"?i<VPN:k==="c"?i>=VPN:true)}
function qScope(){const s=qSel();if(s.length===PAIRS.length)return "all";const eq=a=>a.length===s.length&&a.every((x,i)=>x===s[i]);return eq(idxRange("v"))?"v":eq(idxRange("c"))?"c":"custom"}

function quizHTML(){
  if(!Q){
    return `<section class="q-start"><p class="q-lead">似た2つの単語のうち、1つが読み上げられます。聞こえたほうを選びます。l と r、b と v のように、日本語にない区別がここで身につきます。</p>
<div class="seg qscope" role="tablist">${[["all","すべて"],["v","母音"],["c","子音"]].map(([k,l])=>`<button class="${qScope()===k?"on":""}" data-act="qscope" data-v="${k}">${l}<span class="n">${idxRange(k).length}</span></button>`).join("")}</div>
<dl class="q-sum"><div><dt>問題数</dt><dd>${S.set.qCount}問</dd></div><div><dt>出題する組</dt><dd>${qSel().length}組${qScope()==="custom"?"（個別）":""}</dd></div><div><dt>最高記録</dt><dd>${S.quizBest||0}問</dd></div></dl>
<button class="btn-main" data-act="qstart">${ic("play")}始める</button><button class="btn-sub" data-act="tab" data-tab="settings">問題数と出題する組を変える</button></section>`;
  }
  const n=Q.qs.length;
  if(Q.i>=n){
    return `<section class="q-start"><div class="q-dots">${Q.hist.map(x=>`<i class="${x?"ok":"ng"}"></i>`).join("")}</div><p class="q-score">${Q.score}<small> / ${n}問</small></p><p class="q-lead">${Q.score===n?"全問正解です。":"間違えた組は、音素ページで2つの単語を聞き比べると差がつかめます。"}最高記録は${S.quizBest}問です。</p><button class="btn-main" data-act="qstart">${ic("loop")}もう一度</button><button class="btn-sub" data-act="qback">最初の画面に戻る</button></section>`;
  }
  const q=Q.qs[Q.i],pr=q.pair;
  const dots=Q.qs.map((_,k)=>`<i class="${k<Q.hist.length?(Q.hist[k]?"ok":"ng"):k===Q.i?"cur":""}"></i>`).join("");
  let h=`<div class="q-head"><span>${Q.i+1} / ${n}問</span><span>正解 ${Q.score}</span></div><div class="q-dots">${dots}</div>
<div class="q-stage"><button class="q-play" data-act="qplay" aria-label="もう一度聞く">${ic("play")}</button><button class="q-slow" data-act="qslow">ゆっくり聞く</button></div>
<p class="q-ask">聞こえた単語を選んでください</p><div class="q-choices">`;
  h+=q.order.map(k=>{
    if(Q.ans===null)return `<button class="choice" data-act="qans" data-k="${k}"><span class="cw">${pr[k*2]}</span></button>`;
    const c=k===q.target?"right":k===Q.ans?"wrong":"";
    return `<div class="choice ${c}"><span class="cw">${pr[k*2]}</span><span class="ci">/${pr[k*2+1]}/</span><button class="hear" data-act="qhear" data-w="${pr[k*2]}">${ic("play")}聞く</button></div>`;
  }).join("");
  h+=`</div>`;
  if(Q.ans!==null){const ok=Q.ans===q.target;h+=`<p class="q-fb ${ok?"ok":"ng"}">${ok?"正解":"不正解。読まれたのは "+pr[q.target*2]+" です"}</p><button class="btn-main" data-act="qnext">${Q.i+1>=n?"結果を見る":"次の問題"}</button>`}
  return h;
}

/* ---------- actions ---------- */
function goPhon(id){
  if(!byId(id)||id===curP)return;
  stopPlayAll();if(rec.mr&&rec.mr.state==="recording")rec.mr.stop();
  const p=byId(id);curP=id;curW=null;res={cls:"",html:""};speedOpen=false;S.last=id;S.set.mapKind=p.cat==="cons"?"c":"v";save();
  if(lvF&&!parseWords(p).some(g=>g.words.some(w=>w.lv===lvF)))lvF=0;
  render();window.scrollTo(0,0);centerStrip(true);
}
function openPhon(id,push){
  stopPlayAll();curP=id;curW=null;{const p=byId(id);if(p)S.set.mapKind=p.cat==="cons"?"c":"v"}res={cls:"",html:""};lvF=0;speedOpen=false;S.last=id;save();view="phon";
  if(push)history.pushState({v:"phon"},"");render();window.scrollTo(0,0);centerStrip(false);
}
function goMap(){stopPlayAll();if(rec.mr&&rec.mr.state==="recording")rec.mr.stop();curW=null;view="map";render();window.scrollTo(0,0)}
function pickWord(w,el){
  stopPlayAll();curW=w;res={cls:"",html:""};
  document.querySelectorAll(".wrow").forEach(r=>r.classList.toggle("sel",r.dataset.w===w.text));
  renderSheet();speak(w.text,false);
  const row=el||[...document.querySelectorAll(".wrow")].find(r=>r.dataset.w===w.text);
  if(row)setTimeout(()=>{const b=row.getBoundingClientRect(),limit=innerHeight-(document.querySelector(".sh")||{offsetHeight:0}).offsetHeight-12;if(b.bottom>limit||b.top<140)row.scrollIntoView({block:"center",behavior:"smooth"})},60);
}
function step(d){
  const p=byId(curP),list=viewList(p),i=list.findIndex(x=>x.text===curW.text),w=list[i+d];if(!w)return;
  const g=viewGroups(p).find(g=>g.words.includes(w));
  if(g&&g.i!==-1&&!openG[p.id].has(g.i)){openG[p.id].add(g.i);$main.innerHTML=phonHTML(p)}
  pickWord(w);
}
function armed(b,msg){
  if(b.dataset.armed==="1"){b.dataset.armed="";b.textContent=b.dataset.label;clearTimeout(b._t);return true}
  b.dataset.label=b.textContent;b.dataset.armed="1";b.textContent=msg;
  b._t=setTimeout(()=>{b.dataset.armed="";b.textContent=b.dataset.label},4000);return false;
}
const ACT={
  go(b){goPhon(b.dataset.id)},
  open(b){if(view==="phon"){goPhon(b.dataset.id);return}openPhon(b.dataset.id,true)},
  back(){if(history.state&&history.state.v==="phon")history.back();else goMap()},
  tab(b){stopPlayAll();view=b.dataset.tab;render();window.scrollTo(0,0)},
  mapmode(b){S.set.mapMode=b.dataset.v;save();render()},
  cmode(b){S.set.cMode=b.dataset.v;save();render()},
  mapkind(b){S.set.mapKind=b.dataset.v;save();render()},
  lv(b){stopPlayAll();lvF=+b.dataset.v;const p=byId(curP);if(curW&&!viewList(p).some(w=>w.text===curW.text))curW=null;render()},
  tog(b){const s=openG[curP],i=+b.dataset.g;s.has(i)?s.delete(i):s.add(i);render()},
  play(b,e){e.stopPropagation();stopPlayAll();speak(b.dataset.w,false)},
  pick(b){const w=findWord(byId(curP),b.dataset.w);if(w)pickWord(w,b)},
  prev(){step(-1)},next(){step(1)},
  close(){curW=null;document.querySelectorAll(".wrow.sel").forEach(r=>r.classList.remove("sel"));renderSheet()},
  reveal(b){revealed[b.dataset.k]=curW.text;renderSheet()},
  say(){stopPlayAll();speak(curW.text,false)},
  saySlow(){stopPlayAll();speak(curW.text,true)},
  rec(){toggleRecord()},
  self(){stopPlayAll();playSelf()},
  cmp(){compare()},
  judge(){judge()},
  done(){const on=!isDone(curP,curW.text);setDone(curP,curW.text,on);refreshRow(curW.text);document.querySelectorAll(".wrow").forEach(r=>r.classList.toggle("sel",r.dataset.w===curW.text));renderSheet()},
  all(){
    if(playAll){stopPlayAll();return}
    const p=byId(curP),gs=viewGroups(p),list=gs.flatMap(g=>g.words);if(!list.length)return;
    gs.forEach(g=>{if(g.i!==-1)openG[p.id].add(g.i)});curW=null;$main.innerHTML=phonHTML(p);renderSheet();
    startPlayAll(list);
  },
  speed(){speedOpen=!speedOpen;renderToolbar()},
  rate(b){S.set.rate=+b.dataset.v;save();renderToolbar();if(curW)speak(curW.text,false)},
  togIpa(){S.set.showIpa=!S.set.showIpa;save();const p=byId(curP);$main.innerHTML=phonHTML(p);renderSheet();stickCheck()},
  togJa(){S.set.showJa=!S.set.showJa;save();const p=byId(curP);$main.innerHTML=phonHTML(p);renderSheet();stickCheck()},
  qstart(){
    const sel=qSel();let l=[];while(l.length<S.set.qCount){let s=shuffle(sel);if(l.length&&s.length>1&&s[0]===l[l.length-1])s.push(s.shift());l=l.concat(s)}
    Q={qs:l.slice(0,S.set.qCount).map(i=>({pair:PAIRS[i],target:Math.random()<.5?0:1,order:shuffle([0,1])})),i:0,score:0,ans:null,hist:[]};
    render();window.scrollTo(0,0);speak(qWord(),false);
  },
  qplay(){speak(qWord(),false)},
  qslow(){speak(qWord(),true)},
  qans(b){if(Q.ans!==null)return;Q.ans=+b.dataset.k;const ok=Q.ans===Q.qs[Q.i].target;if(ok)Q.score++;Q.hist.push(ok);render()},
  qhear(b){speak(b.dataset.w,false)},
  qnext(){Q.i++;Q.ans=null;if(Q.i>=Q.qs.length){S.quizBest=Math.max(S.quizBest||0,Q.score);save();render()}else{render();speak(qWord(),false)}},
  qback(){Q=null;render()},
  setv(b){
    const k=b.dataset.k,v=b.dataset.v;S.set[k]=["repeat","recSec","qCount"].includes(k)?+v:v;
    if(k==="accent")S.set.voice="";
    if(k==="order")for(const x in randOrder)delete randOrder[x];
    save();applyLook();render();
  },
  swt(b){const k=b.dataset.k;S.set[k]=!S.set[k];save();b.setAttribute("aria-checked",String(!!S.set[k]))},
  vtest(){speak("Hello. This is how I sound.",false)},
  pair(b){const i=+b.dataset.i;const s=new Set(qSel());s.has(i)?s.delete(i):s.add(i);S.set.qPairs=(s.size===0||s.size===PAIRS.length)?null:[...s].sort((a,b)=>a-b);save();render()},
  qscope(b){const k=b.dataset.v;S.set.qPairs=k==="all"?null:idxRange(k);save();render()},
  pairsAll(){S.set.qPairs=null;save();render()},
  export(){
    const json=JSON.stringify({app:"hatsuon-trainer",version:3,saved:new Date().toISOString(),data:S},null,1),blob=new Blob([json],{type:"application/json"});

    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("書き出しました");
  },
  import(b){if(!armed(b,"もう一度押してファイルを選ぶ"))return;document.getElementById("importFile").click()},
  reset(b){if(!armed(b,"もう一度押すとリセット"))return;S.done={};S.last=null;S.quizBest=0;save();render();toast("学習記録をリセットしました")}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b,e)});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="rateRange"){S.set.rate=+t.value;document.getElementById("spval").textContent=fmtRate(t.value)+"×";document.getElementById("tbrate").textContent=fmtRate(t.value)+"×";document.querySelectorAll(".sp-pre button").forEach(b=>b.classList.toggle("on",Math.abs(+b.dataset.v-S.set.rate)<.001))}
  if(t.dataset.set){S.set[t.dataset.set]=+t.value;const v=document.getElementById("v_"+t.dataset.set);if(v)v.textContent=fmtNum(t.dataset.set,t.value)+t.dataset.unit}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="rateRange"){save();if(curW)speak(curW.text,false)}
  if(t.dataset.set){save();if(t.dataset.set==="rate")speak("This is the new speed.",false);if(t.dataset.set==="slow")speak("This is the slow speed.",true)}
  if(t.id==="vsel"){S.set.voice=t.value;save();speak("Hello.",false)}
  if(t.dataset.pair!==undefined){const ids=[...document.querySelectorAll("[data-pair]")].filter(x=>x.checked).map(x=>+x.dataset.pair);S.set.qPairs=ids.length===PAIRS.length?null:ids;save();const d=t.closest(".srow").querySelector(".desc");if(d)d.textContent=`${qSel().length}組を選択中。何も選ばないとすべての組から出題します`}
  if(t.id==="importFile"&&t.files&&t.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!j||j.app!=="hatsuon-trainer"||!j.data)throw 0;S=normalizeState(j.data);save();applyLook();render();toast("読み込みました")}catch(err){toast("このファイルは読み込めません。書き出したファイルを選んでください")}finally{t.value=""}};fr.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown",e=>{
  if(view!=="phon"||e.altKey||e.ctrlKey||e.metaKey)return;
  const tg=e.target;if(tg&&(tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA"))return;
  if(e.key==="ArrowRight"&&e.shiftKey){goPhon(nbr(curP,1));e.preventDefault()}
  if(e.key==="ArrowLeft"&&e.shiftKey){goPhon(nbr(curP,-1));e.preventDefault()}
});
window.addEventListener("popstate",()=>{if(view==="phon")goMap()});
function stickCheck(){const t=document.getElementById("toolbar");if(!t)return;t.classList.toggle("stuck",t.getBoundingClientRect().top<=56.5)}
window.addEventListener("scroll",stickCheck,{passive:true});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyLook);
let dlNS=null;
try{if(window.claude&&typeof window.claude.use==="function")window.claude.use("downloads").then(ns=>{dlNS=ns}).catch(()=>{})}catch(e){}
applyLook();render();
</script>

(function(){
const STRESS=new Set(["stress","rhythm"]);
SC.forEach(c=>{c.list=c.items.trim().split("\n").map(l=>{const [raw,ear,ja,ud]=l.split("|");return {raw,ear,ja,ud:ud||"",text:raw.replace(/[\[\]·]/g,"").replace(/\s+/g," ").trim()}})});
const scById=id=>SC.find(c=>c.id===id);
const dk=id=>"sc_"+id;
let scCur=null,scOpen=null,scMode="list",SQ=null;
const scRec={mr:null,url:null,text:null,timer:null};

function mark(raw,cat){const cls=STRESS.has(cat)?"sc-st":"hl";return esc(raw).replace(/\[(.+?)\]/g,`<b class="${cls}">$1</b>`)}
function earHTML(e,cat){return esc(e).replace(/\[(.+?)\]/g,'<b class="sc-st">$1</b>')}
function cnt(c){return doneList(dk(c.id)).length}

function listHTML(){
  const tot=SC.reduce((a,c)=>a+c.list.length,0),dn=SC.reduce((a,c)=>a+cnt(c),0);
  let h=`<p class="sc-lead">英語は、つづりどおりには読まれません。音がつながる・消える・変わるルールを知ると、聞き取れる量が増えます。${SC.length}分類・${tot}例、クリア ${dn}。</p><div class="sc-cards">`;
  SC.forEach((c,i)=>{const n=cnt(c),t=c.list.length;
    h+=`<button class="sc-card" data-act="scopen" data-id="${c.id}" style="--c:${c.c};--p:${(n/t).toFixed(3)}"><span class="sc-no">${i+1}</span><span class="sc-cb"><span class="sc-cn">${esc(c.name)}</span><span class="sc-ce">${esc(c.en)}</span><span class="sc-cs">${esc(c.sum)}</span></span><span class="sc-cp">${n}<small>/${t}</small></span><i class="sc-bar"></i></button>`});
  h+=`<button class="sc-card" data-act="scopen" data-id="ind" style="--c:var(--ink2);--p:0"><span class="sc-no">${SC.length+1}</span><span class="sc-cb"><span class="sc-cn">個別の音</span><span class="sc-ce">L / R・th・F / V ほか</span><span class="sc-cs">聞き分けのコツと鏡で見るポイント</span></span><span class="sc-cp">${ic("chevR")}</span></button></div>`;
  h+=`<p class="sc-note">お手本はブラウザの読み上げ音声です。フラップTや飲み込むTなどは、声の種類によって再現されないことがあります。カタカナの「聞こえ方」はめやすです。</p>`;
  return h;
}

function indHTML(){
  let h=`<section class="sc-exp"><p>母音・子音の1音ずつの練習は「練習」タブにあります。日本人が特に間違えやすい組み合わせを、聞き分けのコツと鏡で確認するポイントにまとめました。</p></section>`;
  SC_IND.forEach(x=>{h+=`<section class="sc-ind"><h2>${esc(x.t)}</h2><dl><dt>聞き分けのコツ</dt><dd>${esc(x.ear)}</dd><dt>鏡で確認</dt><dd>${esc(x.mir)}</dd></dl><div class="sc-indb">${x.ids.filter(byId).map(id=>{const p=byId(id);return `<button class="btn-line" data-act="scgo" data-id="${id}"><span class="ph">/${p.ipa}/</span> ${esc(p.key)} を練習</button>`}).join("")}</div></section>`});
  return h;
}

function rowHTML(c,w,i){
  const d=isDone(dk(c.id),w.text),open=scOpen===i,recOn=scRec.mr&&scRec.mr.state==="recording"&&scRec.text===w.text,hasS=scRec.url&&scRec.text===w.text;
  let h=`<div class="sc-row ${open?"open":""}"><button class="sc-rh" data-act="scrow" data-i="${i}" aria-expanded="${open}"><span class="sc-rt ph">${mark(w.raw,c.id)}</span><span class="sc-re">${earHTML(w.ear,c.id)}</span><span class="sc-rj">${esc(w.ja)}</span>${d?`<svg class="sc-ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="クリア"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`:""}</button>`;
  if(open)h+=`<div class="sc-ra"><button data-act="scsay" data-i="${i}">${ic("play")}お手本</button><button data-act="scslow" data-i="${i}">${ic("slow")}ゆっくり</button><button class="${recOn?"rec on":"rec"}" data-act="screc" data-i="${i}">${recOn?ic("stop")+"停止":ic("mic")+"録音"}</button><button data-act="scself" ${hasS?"":"disabled"}>${ic("play")}自分の声</button><button data-act="sccmp" data-i="${i}" ${hasS?"":"disabled"}>聞き比べ</button><button class="sc-done ${d?"on":""}" data-act="scdone" data-i="${i}">${d?"クリア済み":"できた"}</button></div>`;
  return h+`</div>`;
}

function detailHTML(c){
  if(c==="ind")return indHTML();
  let h=`<section class="sc-exp" style="--c:${c.c}"><h2>しくみ</h2><p>${esc(c.how)}</p><h2>コツ</h2><p>${esc(c.tip)}</p><h2>よくあるミス</h2><p>${esc(c.miss)}</p></section>`;
  h+=`<div class="seg sc-seg"><button class="${scMode==="list"?"on":""}" data-act="scmode" data-v="list">例文 ${c.list.length}</button><button class="${scMode==="quiz"?"on":""}" data-act="scmode" data-v="quiz">クイズ</button></div>`;
  if(scMode==="list"){
    h+=`<div class="sc-tb"><button class="btn-line" data-act="scall">${playAll?ic("stop")+"停止":ic("loop")+"連続再生"}</button><span class="sc-leg">${STRESS.has(c.id)?"大きい文字＝強く読む":c.id==="inton"?"↗上げる ↘下げる":"色の部分＝音が変わる所"}</span></div>`;
    h+=c.list.map((w,i)=>rowHTML(c,w,i)).join("");
  }else h+=quizHTML(c);
  return h;
}

/* ---------- quiz ---------- */
function tokens(w){
  const r=w.raw.replace(/[.?!,]/g,"");
  let parts;
  if(r.includes("·"))parts=r.split("·");
  else if(!/\s/.test(r.trim())){ // 1語：文字ごと（括弧は1かたまり）
    parts=[];let m;const re=/\[[^\]]+\]|[^\[]/g;while((m=re.exec(r)))parts.push(m[0]);
  }else parts=r.split(/\s+/);
  return parts.filter(Boolean).map(p=>({t:p.replace(/[\[\]]/g,""),ok:/\[/.test(p)}));
}
function spotOK(w){return /\[/.test(w.raw)&&tokens(w).some(t=>!t.ok)}
function qTypes(c){return c.id==="inton"?[["listen","聞き取り"],["ud","上げ下げ"]]:[["listen","聞き取り"],["spot","変わる所"]]}
function startQuiz(c,type){
  const pool=type==="spot"?c.list.filter(spotOK):c.list;
  const qs=shuffle(pool).slice(0,10).map(w=>{
    if(type==="listen"){const others=shuffle(c.list.filter(x=>x.text!==w.text)).slice(0,3);return {w,ch:shuffle([w,...others])}}
    return {w};
  });
  SQ={cat:c.id,type,qs,i:0,score:0,ans:null,hist:[]};
}
function quizHTML(c){
  if(!SQ||SQ.cat!==c.id){
    const best=(S.scBest&&S.scBest[c.id])||0;
    return `<section class="sc-qs"><p class="sc-qd">10問。「聞き取り」は流れた文を4つから選ぶ。${c.id==="inton"?"「上げ下げ」は文末が上がるか下がるかを選ぶ。":"「変わる所」は音が変化・脱落する部分をタップする。"}</p>${best?`<p class="sc-qbest">最高 ${best} / 10</p>`:""}<div class="sc-qbtn">${qTypes(c).map(([k,l])=>`<button class="btn-main" data-act="scqstart" data-v="${k}">${ic("play")}${l}</button>`).join("")}</div></section>`;
  }
  const n=SQ.qs.length;
  if(SQ.i>=n)return `<section class="sc-qs"><div class="q-dots">${SQ.hist.map(x=>`<i class="${x?"ok":"ng"}"></i>`).join("")}</div><p class="q-score">${SQ.score}<small> / ${n}問</small></p><div class="sc-qbtn"><button class="btn-main" data-act="scqstart" data-v="${SQ.type}">もう一度</button><button class="btn-sub" data-act="scqback">やめる</button></div></section>`;
  const q=SQ.qs[SQ.i],w=q.w;
  let h=`<div class="sc-qbar"><span>${SQ.i+1} / ${n}</span><button class="linkbtn" data-act="scqback">やめる</button></div>`;
  if(SQ.type==="listen"){
    h+=`<div class="q-stage"><button class="q-play" data-act="scqplay" aria-label="もう一度聞く">${ic("play")}</button><button class="q-slow" data-act="scqslow">ゆっくり聞く</button></div><div class="sc-qch">`;
    h+=q.ch.map((x,k)=>{
      if(SQ.ans===null)return `<button class="sc-opt" data-act="scqans" data-k="${k}"><span class="ph">${esc(x.text)}</span></button>`;
      const cl=x===w?"right":(k===SQ.ans?"wrong":"");
      return `<div class="sc-opt ${cl}"><span class="ph">${mark(x.raw,c.id)}</span><span class="sc-oe">${earHTML(x.ear,c.id)}</span><button class="hear" data-act="scqhear" data-k="${k}">${ic("play")}</button></div>`}).join("")+`</div>`;
  }else if(SQ.type==="ud"){
    h+=`<div class="q-stage"><button class="q-play" data-act="scqplay">${ic("play")}</button><p class="sc-qt ph">${esc(w.text)}</p></div><div class="sc-qch two">`;
    h+=[["u","↗ 上がる"],["d","↘ 下がる"]].map(([v,l])=>{
      if(SQ.ans===null)return `<button class="sc-opt big" data-act="scqans" data-k="${v}">${l}</button>`;
      return `<div class="sc-opt big ${v===w.ud?"right":(v===SQ.ans?"wrong":"")}">${l}</div>`}).join("")+`</div>`;
  }else{
    const tk=tokens(w);
    h+=`<p class="sc-qd">音が変化する・消える・強くなる所はどこ？</p><div class="q-stage"><button class="q-play" data-act="scqplay">${ic("play")}</button></div><div class="sc-tok">`;
    h+=tk.map((t,k)=>{
      if(SQ.ans===null)return `<button class="ph" data-act="scqans" data-k="${k}">${esc(t.t)}</button>`;
      return `<span class="ph ${t.ok?"right":(k===SQ.ans?"wrong":"")}">${esc(t.t)}</span>`}).join("")+`</div>`;
  }
  if(SQ.ans!==null){
    const ok=SQ.hist[SQ.hist.length-1];
    h+=`<div class="sc-fb ${ok?"ok":"ng"}"><b>${ok?"正解":"不正解"}</b><span class="ph">${mark(w.raw,c.id)}</span><span>${earHTML(w.ear,c.id)}　${esc(w.ja)}</span></div><button class="btn-main" data-act="scqnext">${SQ.i+1<n?"次へ":"結果を見る"}</button>`;
  }
  return h;
}

/* ---------- recording ---------- */
async function recToggle(text){
  if(scRec.mr&&scRec.mr.state==="recording"){scRec.mr.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("この環境では録音できません");return}
  stopPlayAll();try{speechSynthesis.cancel()}catch(e){}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("マイクを使えません。ブラウザのマイク許可を確認してください");return}
  const ch=[],mr=new MediaRecorder(st);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(scRec.timer);if(scRec.url)URL.revokeObjectURL(scRec.url);scRec.url=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||"audio/webm"}));scRec.mr=null;rerender();if(S.set.autoCmp)cmp(text)};
  mr.start();scRec.mr=mr;scRec.text=text;scRec.timer=setTimeout(()=>{if(mr.state==="recording")mr.stop()},Math.max(5,S.set.recSec)*1000);rerender();
}
function self(cb){if(!scRec.url){if(cb)cb();return}const a=new Audio(scRec.url);if(cb){a.onended=cb;a.onerror=cb}a.play().catch(()=>{if(cb)cb()})}
function cmp(text){stopPlayAll();speak(text,false,()=>setTimeout(()=>self(),300))}

/* ---------- view ---------- */
function curC(){return scCur==="ind"?"ind":scById(scCur)}
function rerender(){if(view==="sc"||view==="scd"){const y=window.scrollY;render();window.scrollTo(0,y)}}
const _render=render;
render=function(){
  if(view!=="sc"&&view!=="scd"){document.querySelector('.nav button[data-tab="sc"]').classList.remove("on");return _render()}
  document.body.dataset.view=view;document.body.style.removeProperty("--c");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==="sc"));
  if(view==="sc"){$top.innerHTML=`<h1>音の変化</h1>`;$main.innerHTML=listHTML()}
  else{const c=curC(),nm=c==="ind"?"個別の音":c.name;
    $top.innerHTML=`<button class="back" data-act="scback" aria-label="一覧に戻る">${ic("chevL")}</button><h1>${esc(nm)}</h1>${c!=="ind"?`<span class="meta">${cnt(c)} / ${c.list.length}</span>`:""}`;
    $main.innerHTML=detailHTML(c)}
  renderSheet();
};
const textOf=b=>curC().list[+b.dataset.i].text;
Object.assign(ACT,{
  scopen(b){stopPlayAll();scCur=b.dataset.id;scOpen=null;scMode="list";SQ=null;view="scd";history.pushState({v:"scd"},"");render();window.scrollTo(0,0)},
  scback(){if(history.state&&history.state.v==="scd")history.back();else{stopPlayAll();view="sc";render()}},
  scgo(b){openPhon(b.dataset.id,true)},
  scrow(b){const i=+b.dataset.i;scOpen=scOpen===i?null:i;rerender();if(scOpen===i)speak(curC().list[i].text,false)},
  scsay(b){stopPlayAll();speak(textOf(b),false)},
  scslow(b){stopPlayAll();speak(textOf(b),true)},
  screc(b){recToggle(textOf(b))},
  scself(){stopPlayAll();self()},
  sccmp(b){cmp(textOf(b))},
  scdone(b){const c=curC(),t=textOf(b);setDone(dk(c.id),t,!isDone(dk(c.id),t));rerender()},
  scmode(b){stopPlayAll();scMode=b.dataset.v;SQ=null;render()},
  scall(){if(playAll){stopPlayAll();rerender();return}const l=curC().list.map(w=>({text:w.text,ja:w.ja}));startPlayAll(l);rerender()},
  scqstart(b){startQuiz(curC(),b.dataset.v);render();window.scrollTo(0,0);speak(SQ.qs[0].w.text,false)},
  scqplay(){speak(SQ.qs[SQ.i].w.text,false)},
  scqslow(){speak(SQ.qs[SQ.i].w.text,true)},
  scqhear(b){speak(SQ.qs[SQ.i].ch[+b.dataset.k].text,false)},
  scqans(b){if(SQ.ans!==null)return;const q=SQ.qs[SQ.i];let ok;
    if(SQ.type==="listen"){SQ.ans=+b.dataset.k;ok=q.ch[SQ.ans]===q.w}
    else if(SQ.type==="ud"){SQ.ans=b.dataset.k;ok=SQ.ans===q.w.ud}
    else{SQ.ans=+b.dataset.k;ok=tokens(q.w)[SQ.ans].ok}
    if(ok)SQ.score++;SQ.hist.push(ok);rerender()},
  scqnext(){SQ.i++;SQ.ans=null;if(SQ.i>=SQ.qs.length){S.scBest=S.scBest||{};S.scBest[SQ.cat]=Math.max(S.scBest[SQ.cat]||0,SQ.score);save();render()}else{render();speak(SQ.qs[SQ.i].w.text,false)}window.scrollTo(0,0)},
  scqback(){SQ=null;render()}
});
const _tab=ACT.tab;ACT.tab=function(b,e){if(b.dataset.tab==="sc"){stopPlayAll();view="sc";render();window.scrollTo(0,0);return}_tab(b,e)};
window.addEventListener("popstate",()=>{if(view==="scd"){stopPlayAll();view="sc";render()}});
/* 学習記録の書き出し・読み込みでクイズ最高点も保持 */
const _norm=normalizeState;normalizeState=function(s){const o=_norm(s);if(s&&s.scBest&&typeof s.scBest==="object")o.scBest=s.scBest;return o};
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.scBest)S.scBest=raw.scBest}catch(e){}
})();
</script>
